name: CI/CD

on:
  push:
    branches:
      - main

jobs:

  # ==========================================
  # BUILD & PUSH DOCKER IMAGE
  # ==========================================
  build-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest

    steps:

      # Checkout source code
      - name: Checkout
        uses: actions/checkout@v4

      # Login Docker Hub
      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # ==========================================
      # BACKEND
      # ==========================================
      - name: Build Backend
        run: |
          docker build \
            -t haechanlovelove/perpustakaan-backend:v1 \
            ./backend

      - name: Push Backend
        run: |
          docker push \
            haechanlovelove/perpustakaan-backend:v1

      # ==========================================
      # FRONTEND
      # ==========================================
      - name: Build Frontend
        run: |
          docker build \
            -t haechanlovelove/perpustakaan-frontend:v1 \
            ./frontend

      - name: Push Frontend
        run: |
          docker push \
            haechanlovelove/perpustakaan-frontend:v1


  # ==========================================
  # DEPLOY TO VM
  # ==========================================
  deploy:
    name: Deploy to VM
    needs: build-push
    runs-on: ubuntu-latest

    steps:

      # Checkout untuk mengambil docker-compose.prod.yml
      - name: Checkout
        uses: actions/checkout@v4

      # ==========================================
      # COPY COMPOSE FILE TO VM
      # ==========================================
      - name: Copy docker-compose.prod.yml ke VM
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          port: ${{ secrets.VM_SSH_PORT || 22 }}

          source: "docker-compose.prod.yml"
          target: "/opt/perpustakaan-digital"

      # ==========================================
      # DEPLOY
      # ==========================================
      - name: Deploy ke VM
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          port: ${{ secrets.VM_SSH_PORT || 22 }}

          script: |
            set -e

            cd /opt/perpustakaan-digital

            echo "================================"
            echo "Pull Backend Image"
            echo "================================"

            docker pull haechanlovelove/perpustakaan-backend:v1

            echo "================================"
            echo "Pull Frontend Image"
            echo "================================"

            docker pull haechanlovelove/perpustakaan-frontend:v1

            echo "================================"
            echo "Start Application"
            echo "================================"

            docker compose -f docker-compose.prod.yml up -d

            echo "================================"
            echo "Container Status"
            echo "================================"

            docker ps

            echo "================================"
            echo "Deploy v1 berhasil!"
            echo "================================"