trigger:
  branches:
    include:
      - master

# =========================================================
# VARIABLES
# =========================================================

variables:
  - group: 22-Sep

  # Docker Hub image
  - name: BACKEND_IMAGE
    value: haechanlovelove/perpustakaan-backend

  - name: FRONTEND_IMAGE
    value: haechanlovelove/perpustakaan-frontend

  # Image tag
  - name: IMAGE_TAG
    value: v1

  # Deployment directory on EC2
  - name: DEPLOY_PATH
    value: /opt/perpustakaan-digital


# =========================================================
# STAGE 1 - BUILD & PUSH
# =========================================================

stages:

- stage: BuildAndPush
  displayName: "Build & Push Docker Images"

  jobs:

  - job: DockerBuildPush
    displayName: "Build and Push Backend & Frontend"

    pool:
      vmImage: ubuntu-latest

    steps:

    # -----------------------------------------------------
    # Checkout source code
    # -----------------------------------------------------

    - checkout: self
      displayName: "Checkout Repository"


    # -----------------------------------------------------
    # Login Docker Hub
    # -----------------------------------------------------

    - script: |
        echo "$(DOCKER_PASSWORD)" | docker login \
          -u "$(DOCKER_USERNAME)" \
          --password-stdin
      displayName: "Login to Docker Hub"


    # -----------------------------------------------------
    # Build Backend
    # -----------------------------------------------------

    - script: |
        docker build \
          -t $(BACKEND_IMAGE):$(IMAGE_TAG) \
          -t $(BACKEND_IMAGE):latest \
          ./backend
      displayName: "Build Backend Image"


    # -----------------------------------------------------
    # Push Backend
    # -----------------------------------------------------

    - script: |
        docker push $(BACKEND_IMAGE):$(IMAGE_TAG)
        docker push $(BACKEND_IMAGE):latest
      displayName: "Push Backend Image"


    # -----------------------------------------------------
    # Build Frontend
    # -----------------------------------------------------

    - script: |
        docker build \
          -t $(FRONTEND_IMAGE):$(IMAGE_TAG) \
          -t $(FRONTEND_IMAGE):latest \
          ./frontend
      displayName: "Build Frontend Image"


    # -----------------------------------------------------
    # Push Frontend
    # -----------------------------------------------------

    - script: |
        docker push $(FRONTEND_IMAGE):$(IMAGE_TAG)
        docker push $(FRONTEND_IMAGE):latest
      displayName: "Push Frontend Image"


# =========================================================
# STAGE 2 - DEPLOY TO EC2
# =========================================================

- stage: Deploy
  displayName: "Deploy to EC2"

  dependsOn:
    - BuildAndPush

  condition: succeeded()

  jobs:

  - job: DeployToVM
    displayName: "Deploy Application to EC2"

    pool:
      vmImage: ubuntu-latest

    steps:

    # -----------------------------------------------------
    # Checkout repository
    # -----------------------------------------------------

    - checkout: self
      displayName: "Checkout Repository"


    # -----------------------------------------------------
    # Prepare SSH
    # -----------------------------------------------------

    - script: |

        echo "Preparing SSH configuration..."

        mkdir -p ~/.ssh

        echo "$(VM_SSH_PRIVATE_KEY)" > ~/.ssh/id_rsa

        chmod 600 ~/.ssh/id_rsa

        ssh-keyscan \
          -p "$(VM_SSH_PORT)" \
          "$(VM_HOST)" \
          >> ~/.ssh/known_hosts

        echo "SSH configuration completed."

      displayName: "Prepare SSH Key"


    # -----------------------------------------------------
    # Test SSH Connection
    # -----------------------------------------------------

    - script: |

        ssh \
          -o StrictHostKeyChecking=yes \
          -p "$(VM_SSH_PORT)" \
          "$(VM_USER)@$(VM_HOST)" \
          "echo 'SSH connection successful'"

      displayName: "Test SSH Connection"


    # -----------------------------------------------------
    # Create deployment directory
    # -----------------------------------------------------

    - script: |

        ssh \
          -p "$(VM_SSH_PORT)" \
          "$(VM_USER)@$(VM_HOST)" \
          "mkdir -p $(DEPLOY_PATH)"

      displayName: "Create Deployment Directory"


    # -----------------------------------------------------
    # Copy docker-compose.prod.yml
    # -----------------------------------------------------

    - script: |

        scp \
          -P "$(VM_SSH_PORT)" \
          docker-compose.prod.yml \
          "$(VM_USER)@$(VM_HOST):$(DEPLOY_PATH)/docker-compose.prod.yml"

      displayName: "Copy Docker Compose to EC2"


    # -----------------------------------------------------
    # Deploy Application
    # -----------------------------------------------------

    - script: |

        ssh \
          -p "$(VM_SSH_PORT)" \
          "$(VM_USER)@$(VM_HOST)" << 'EOF'

        set -e

        echo "========================================="
        echo "Starting deployment..."
        echo "========================================="

        cd $(DEPLOY_PATH)

        echo ""
        echo "Pulling backend image..."
        docker pull $(BACKEND_IMAGE):$(IMAGE_TAG)

        echo ""
        echo "Pulling frontend image..."
        docker pull $(FRONTEND_IMAGE):$(IMAGE_TAG)

        echo ""
        echo "Stopping old containers if necessary..."
        docker compose \
          -f docker-compose.prod.yml \
          down

        echo ""
        echo "Starting new containers..."
        docker compose \
          -f docker-compose.prod.yml \
          up -d

        echo ""
        echo "========================================="
        echo "Running containers:"
        echo "========================================="

        docker ps

        echo ""
        echo "========================================="
        echo "Deployment completed successfully!"
        echo "========================================="

        EOF

      displayName: "Deploy Application"


    # -----------------------------------------------------
    # Health Check
    # -----------------------------------------------------

    - script: |

        echo "Waiting for application to start..."

        sleep 10

        ssh \
          -p "$(VM_SSH_PORT)" \
          "$(VM_USER)@$(VM_HOST)" \
          "curl -f http://localhost:4000/api/health"

      displayName: "Health Check"