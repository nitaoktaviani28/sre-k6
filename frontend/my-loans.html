<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Peminjaman Saya - Perpustakaan Digital</title>
  <link rel="stylesheet" href="assets/css/style.css" />
</head>
<body>
  <div id="navbar" class="navbar"></div>

  <div class="container">
    <div class="page-header">
      <h1>Peminjaman Saya</h1>
      <p>Daftar buku yang sedang atau pernah Anda pinjam.</p>
    </div>

    <div class="alert alert-error" id="errorAlert"></div>
    <div class="alert alert-success" id="successAlert"></div>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Judul Buku</th>
            <th>Tanggal Pinjam</th>
            <th>Batas Kembali</th>
            <th>Status</th>
            <th>Aksi</th>
          </tr>
        </thead>
        <tbody id="loansBody"></tbody>
      </table>
    </div>
    <div id="emptyState" class="empty-state hidden">
      <div class="icon">📭</div>
      <p>Anda belum memiliki riwayat peminjaman.</p>
    </div>
  </div>

  <div class="footer">Perpustakaan Digital &middot; Dibangun dengan Node.js &amp; JavaScript murni</div>

  <script src="assets/js/config.js?v=2"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/nav.js"></script>
  <script>
    Auth.requireLogin();
    renderNavbar('my-loans');

    const loansBody = document.getElementById('loansBody');
    const emptyState = document.getElementById('emptyState');
    const errorAlert = document.getElementById('errorAlert');
    const successAlert = document.getElementById('successAlert');

    function showError(message) {
      errorAlert.textContent = message;
      errorAlert.classList.add('show');
      setTimeout(() => errorAlert.classList.remove('show'), 4000);
    }

    function showSuccess(message) {
      successAlert.textContent = message;
      successAlert.classList.add('show');
      setTimeout(() => successAlert.classList.remove('show'), 3000);
    }

    function formatDate(iso) {
      if (!iso) return '-';
      return new Date(iso).toLocaleDateString('id-ID', { day: '2-digit', month: 'short', year: 'numeric' });
    }

    async function loadLoans() {
      try {
        const loans = await Api.listLoans();
        emptyState.classList.toggle('hidden', loans.length > 0);
        loansBody.innerHTML = '';

        loans
          .sort((a, b) => new Date(b.borrowedAt) - new Date(a.borrowedAt))
          .forEach((loan) => {
            const tr = document.createElement('tr');
            const isBorrowed = loan.status === 'borrowed';
            tr.innerHTML = `
              <td>${escapeHtml(loan.bookTitle || '-')}</td>
              <td>${formatDate(loan.borrowedAt)}</td>
              <td>${formatDate(loan.dueDate)}</td>
              <td><span class="badge ${isBorrowed ? 'badge-borrowed' : 'badge-returned'}">${
                isBorrowed ? 'Dipinjam' : 'Dikembalikan'
              }</span></td>
              <td>
                ${
                  isBorrowed
                    ? `<button class="btn btn-outline btn-sm return-btn" data-id="${loan.id}">Kembalikan</button>`
                    : '<span class="text-muted">-</span>'
                }
              </td>
            `;
            loansBody.appendChild(tr);
          });

        document.querySelectorAll('.return-btn').forEach((btn) => {
          btn.addEventListener('click', () => returnLoan(Number(btn.dataset.id), btn));
        });
      } catch (err) {
        showError(err.message);
      }
    }

    async function returnLoan(id, btn) {
      const confirmed = await UI.confirm({
        title: 'Kembalikan Buku',
        message: 'Kembalikan buku ini sekarang?',
        confirmText: 'Ya, Kembalikan',
        cancelText: 'Batal',
      });
      if (!confirmed) return;

      const originalLabel = btn ? btn.textContent : '';
      if (btn) {
        btn.disabled = true;
        btn.textContent = 'Memproses...';
      }
      try {
        await Api.returnLoan(id);
        UI.toast('Buku berhasil dikembalikan. Terima kasih!', 'success');
        showSuccess('Buku berhasil dikembalikan. Terima kasih!');
        loadLoans();
      } catch (err) {
        UI.toast(err.message, 'error');
        showError(err.message);
        if (btn) {
          btn.disabled = false;
          btn.textContent = originalLabel;
        }
      }
    }

    loadLoans();
  </script>
</body>
</html>
