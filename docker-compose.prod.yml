version: "3.9"

# ---------------------------------------------------------------------------
# Perpustakaan Digital - Production compose file
# Digunakan oleh CI/CD (.github/workflows/ci-cd.yml) untuk deploy ke VM.
# Image di-pull dari Docker registry (bukan build lokal), lalu dijalankan
# lewat `docker compose up -d`.
#
# Variabel environment yang dibutuhkan (diisi lewat file .env di VM,
# otomatis dibuat oleh workflow deploy dari GitHub Actions Variables):
#   DOCKER_REGISTRY        contoh: docker.io
#   DOCKER_IMAGE_BACKEND    contoh: namauser/perpustakaan-backend
#   DOCKER_IMAGE_FRONTEND   contoh: namauser/perpustakaan-frontend
#   IMAGE_TAG               contoh: latest / commit sha
# ---------------------------------------------------------------------------

services:
  backend:
    image: ${DOCKER_REGISTRY}/${DOCKER_IMAGE_BACKEND}:${IMAGE_TAG:-latest}
    container_name: perpustakaan-backend
    ports:
      - "4000:4000"
    environment:
      - PORT=4000
    restart: unless-stopped

  frontend:
    image: ${DOCKER_REGISTRY}/${DOCKER_IMAGE_FRONTEND}:${IMAGE_TAG:-latest}
    container_name: perpustakaan-frontend
    ports:
      - "5500:80"
    depends_on:
      - backend
    restart: unless-stopped
